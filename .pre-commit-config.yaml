repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@2.8.4
  - repo: https://github.com/sbrunner/hooks
    rev: 1.9.0
    hooks:
      - id: uv-lock
        additional_dependencies:
          - uv==0.13.6 # pypi
        files: ^\.github/publish/pyproject\.toml$
